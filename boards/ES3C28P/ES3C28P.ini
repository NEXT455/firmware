[env:ES3C28P]
board = esp32-s3-devkitc-1
board_build.variant = ES3C28P
board_build.arduino.memory_type = qio_qspi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = custom_8Mb.csv

build_src_filter = ${env.build_src_filter} +<../boards/ES3C28P>

build_flags = 
    ${env.build_flags}
    -D ES3C28P=1
    -D DEVICE_NAME=\"ES3C28P\"
    -D BOARD_HAS_PSRAM=1
    -D CONFIG_SPIRAM_SUPPORT=1
    
    -D HAS_TOUCH=1
    
    -D SPI_SCK_PIN=14
    -D SPI_MOSI_PIN=3
    -D SPI_MISO_PIN=2
    -D SPI_SS_PIN=21
    
    -D BAD_RX=44
    -D BAD_TX=43
    
    ; NRF24L01 - الأسماء لازم تكون بالضبط هيك عشان core/configPins.h يلقطها
    -D USE_NRF24_VIA_SPI
    -D NRF24_CE_PIN=1
    -D NRF24_SS_PIN=21
    -D NRF24_SCK_PIN=14
    -D NRF24_MOSI_PIN=3
    -D NRF24_MISO_PIN=2
    
    -D IR_RX_PIN=7
    -D IR_TX_PIN=4
    
    -D ANALOG_BAT_PIN=9
    -D MINBRIGHT=1
    
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_INVERSION_ON=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=46
    -D TFT_RST=-1
    -D TFT_BL=45
    -D TFT_BACKLIGHT_ON=HIGH
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000

    -D TOUCH_CS=17
    -D SPI_TOUCH_FREQUENCY=2500500

lib_deps = 
    ${env.lib_deps}
