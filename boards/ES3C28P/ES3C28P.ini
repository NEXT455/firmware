[env:ES3C28P]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.flash_mode = qio

build_flags = 
    ${env.build_flags}
    -D ES3C28P=1
    -D BOARD_ES3C28P=1
    -D DEVICE_NAME=\"ES3C28P\"
    -D BOARD_HAS_PSRAM=1
    -D CONFIG_SPIRAM_SUPPORT=1
    
    -Iboards/ES3C28P
    -I"${platformio.packages_dir}/framework-arduinoespressif32/variants/esp32s3"
    
    -D ILI9341_2_DRIVER=1
    -D TFT_INVERSION_ON=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=46
    -D TFT_RST=-1
    -D TFT_BL=45
    -D TFT_BACKLIGHT_ON=HIGH
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000

    -D USE_SD_MMC

lib_deps = 
    ${env.lib_deps}
