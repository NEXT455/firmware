[env:ES3C28P]
extends = esp32s3_base
board = esp32-s3-devkitc-1

; =============================================
; Flash & PSRAM Configuration (N8R2 Specs)
; Flash: 8MB (QSPI) / PSRAM: 2MB (QSPI)
; =============================================
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions_8Mb.csv
board_build.arduino.memory_type = qio_qspi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.flash_mode = qio

; =============================================
; Build Flags & Hardware Definitions
; =============================================
build_flags =
    -D ES3C28P=1
    -I firmware/boards/ES3C28P
    -D BOARD_HAS_PSRAM=1
    -D CONFIG_SPIRAM_SUPPORT=1
    
    ; Display Driver Setup
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_INVERSION_ON=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=46
    -D TFT_RST=-1
    -D TFT_BL=45
    -D TFT_BACKLIGHT_ON=HIGH
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000

    ; Resistive Touch (SPI XPT2046)
    -D TOUCH_CS=17
    -D SPI_TOUCH_FREQUENCY=2500000

    ; Storage Mode
    -D USE_SD_MMC

; =============================================
; Extra Build Configurations
; =============================================
lib_deps =
    ${esp32s3_base.lib_deps}

build_unflags =
    ${esp32s3_base.build_unflags}
